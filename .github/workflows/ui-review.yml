name: UI review
on:
  push:
    branches: [codex/updaeted-ui]
  workflow_dispatch:
jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --no-file-parallelism --testTimeout=15000
      - run: npm run build
